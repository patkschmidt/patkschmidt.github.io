{% comment %}
    Base HTML wrapper for *every* page and post
{% endcomment %}
<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
    <header>
        <nav><a href="{{ '/' | relative_url }}">{{ site.title }}</a></nav>
    </header>
    <main>
        {{ content }}
    </main>
</body>
</html>
